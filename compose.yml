name: zeroshield

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18.4}
    container_name: zeroshield-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - zeroshield_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - zeroshield_backend

    restart: unless-stopped

volumes:
  zeroshield_postgres_data:
    name: zeroshield-postgres-data

networks:
  zeroshield_backend:
    name: zeroshield-backend
    driver: bridge